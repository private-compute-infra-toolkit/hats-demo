kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30080 # This will be the NodePort for your service
    hostPort: 7572
    protocol: TCP
  extraMounts:
  - hostPath: ../
    containerPath: /mnt/pv # This path inside the Kind node container
