apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-local
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 3Gi # Adjust as needed
  accessModes:
    - ReadOnlyMany
  hostPath:
    path: "/mnt/pv" # This path MUST match the containerPath in kind-config.yaml extraMounts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-workload
spec:
  storageClassName: manual
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 3Gi # Must be less than or equal to PV capacity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server2
  template:
    metadata:
      labels:
        app: server2
    spec:
      containers:
      - name: launcher-container2
        image: launcher:latest # Make sure this image is available
        imagePullPolicy: IfNotPresent # Or Always, depending on your needs
        env:
        - name: NO_SNP
          value: "1"
        - name: SYSTEM_BUNDLE
          value: "/pv/system_bundle.tar"
        - name: RUNC_RUNTIME_BUNDLE
          value: "/pv/runtime_bundle.tar"
        - name: TVS_ADDRESSES
          value: "tvs:7774"
        - name: TVS_AUTHENTICATION_KEY
          value: "8f698f0b278cf57318a92faebb1dc49cda242973f2304e38660dc9bbc5cb18e5"
        - name: NUM_CPUS
          value: "1" 
        - name: RAMDRIVE_SIZE_KB
          value: "1048576" 
        - name: RAM_SIZE_KB
          value: "1048576"
        securityContext:
          # Another option is writing a daemon set for Device Plugin.
          # The security posture is similar however because that plugin requires
          # privileged access.
          privileged: true
        volumeMounts:
        - name: workload-storage
          mountPath: "/pv" # Mount path for the PV inside the container
      volumes:
      - name: workload-storage
        persistentVolumeClaim:
          claimName: pvc-workload
---
apiVersion: v1
kind: Service
metadata:
  name: server2 # Changed to match your requested service name "server1"
spec:
  type: ClusterIP
  selector:
    app: server2 # Must match the labels of your Pods
  ports:
  - protocol: TCP
    port: 8080       # Port the service is available on *inside* the cluster
    targetPort: 8080 # Port your container is listening on (adjust if different)

---
